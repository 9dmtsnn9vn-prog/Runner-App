const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const STORAGE_KEY='runner.activities.v1';let activities=[];try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(saved))activities=saved}catch(e){console.warn('Could not read activity history',e)}function saveActivities(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(activities))}catch(e){alert('Could not save activity in this browser. Export your backup and check available storage.')}}function exportActivities(){const blob=new Blob([JSON.stringify({app:'Runner App',version:1,exportedAt:new Date().toISOString(),activities},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='runner-activities-backup.json';a.click();URL.revokeObjectURL(url)}function importActivities(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result),list=Array.isArray(d)?d:d.activities;if(!Array.isArray(list))throw Error('Invalid backup');if(!confirm('Import '+list.length+' activities? This will replace the current activity history on this device.'))return;activities=list;saveActivities();render()}catch(e){alert('That backup could not be read. Please choose a Runner App JSON backup.')}};reader.readAsText(file)}

let planPreferences=loadPlanPreferences();

function targetPaceLabel(target){if(!target||target==='comfort')return 'No pace target';const parts=target.split(':').map(Number),seconds=(parts[0]*60+parts[1])*60/42.195;const total=Math.round(seconds),mins=Math.floor(total/60),secs=String(total%60).padStart(2,'0');return mins+':'+secs+' /km marathon pace'}

'<div class="calendar-toolbar"><div><span class="eyebrow">YOUR TRAINING CALENDAR</span><h2>Plan your week.</h2><p>Choose a day to see its session, then log it or export your next four weeks.</p></div><button class="btn primary" id="export-calendar">＋ Add to Calendar</button></div><article class="card calendar-card"><div class="calendar-month"><button class="month-arrow" id="prev-week" aria-label="Previous week">‹</button><div><b id="week-label"></b><span id="week-range"></span></div><button class="month-arrow" id="next-week" aria-label="Next week">›</button></div><div class="calendar-days" id="calendar-days"></div><div class="calendar-divider"></div><div class="calendar-agenda"><div class="agenda-heading"><div><span class="eyebrow" id="agenda-kicker">YOUR DAY</span><h3 id="agenda-title">Sessions</h3></div><span class="muted" id="agenda-count"></span></div><div id="agenda-list"></div></div><div class="calendar-foot"><span class="calendar-dot"></span><span>Sessions are a flexible starter plan, not fixed appointments. Adjust for recovery.</span></div></article><article class="card calendar-help"><div class="help-icon">↗</div><div><b>Keep your plan in Apple Calendar</b><p>Export the next four weeks as an .ics file, then open it on your iPhone to add the sessions to your calendar.</p></div><button class="text-btn" id="export-calendar-secondary">Export .ics ↗</button></article>';
}
const descriptions={Today:['Today, made simple.','A steady start is a strong start.'],Plan:['Plan your week.','Build the habit without rushing the distance.'],Explore:['Find your next route.','A change of scenery can make an easy run easier.'],Progress:['Small steps add up.','Your activity history, all in one place.'],Race:['Make race week feel simple.','Keep the essentials together as May approaches.']};let active='Today';const dateOnly=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());const isoDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');function mondayOf(d){const x=dateOnly(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function fmt(d,opt={day:'numeric',month:'short'}){return d.toLocaleDateString('en-GB',opt)}function calendarSession(d){
